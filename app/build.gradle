apply plugin: 'com.android.application'

def pocketSigning = new Properties()
def pocketSigningFile = rootProject.file('.local/signing/signing.properties')
if (!pocketSigningFile.exists()) {
    throw new GradleException('Сначала выполни tools/Setup.ps1 для подготовки локальной подписи.')
}
pocketSigningFile.withInputStream { pocketSigning.load(it) }

android {
    namespace 'net.typeblog.shelter'
    compileSdk 35
    // 35.0.0 emits unescaped Windows paths in generated AIDL Java comments.
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.nekontritce11123.pocketandroid'
        minSdk 29
        targetSdk 35
        versionCode providers.gradleProperty('pocketVersionCode').getOrElse('11').toInteger()
        versionName providers.gradleProperty('pocketVersionName').getOrElse('0.3.5')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        pocket {
            storeFile rootProject.file('.local/signing/pocket.p12')
            storeType 'PKCS12'
            storePassword pocketSigning.getProperty('storePassword')
            keyAlias pocketSigning.getProperty('keyAlias')
            keyPassword pocketSigning.getProperty('keyPassword')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.pocket }
        release {
            signingConfig signingConfigs.pocket
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'GoogleAppIndexingWarning', 'InvalidFragmentVersionForActivityResult'
    }
    buildFeatures {
        aidl true
        buildConfig true
    }
}

dependencies {
    implementation files('libs/libbox.aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    debugImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatDebugRuntimeElements')
    releaseImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatReleaseRuntimeElements')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
